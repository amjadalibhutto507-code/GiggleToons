name: Generate GiggleToons First Short

on:
  push:
    branches: [main]
    paths:
      - 'scripts/viral_short_prompt.txt'
      - 'scripts/recover_artifact.txt'
  workflow_dispatch:
    inputs:
      allow_credit_use:
        description: "Approve using existing Magic Hour account credits for one 10-second generation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate one vertical Short with Magic Hour
        env:
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          ALLOW_MAGIC_HOUR_CREDITS: ${{ github.event_name == 'push' || inputs.allow_credit_use }}
        run: python scripts/generate_first_short.py

      - name: Upload generated MP4
        if: success() && (github.event_name == 'push' || inputs.allow_credit_use)
        uses: actions/upload-artifact@v4
        with:
          name: giggletoons-first-short
          path: output/giggletoons_quality_check_short.mp4
          if-no-files-found: error
          retention-days: 7
