name: Generate GiggleToons Short

on:
  workflow_dispatch:
    inputs:
      allow_credit_use:
        description: "Approve one Magic Hour generation (credits will be charged)"
        required: true
        type: boolean
        default: false
      duration_seconds:
        description: "Video duration in seconds (5 seconds is the low-credit test)"
        required: true
        type: choice
        options:
          - "5"
          - "10"
        default: "5"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate one vertical Short with Magic Hour
        env:
          MAGIC_HOUR_API_KEY: ${{ secrets.MAGIC_HOUR_API_KEY }}
          ALLOW_MAGIC_HOUR_CREDITS: ${{ inputs.allow_credit_use }}
          VIDEO_DURATION_SECONDS: ${{ inputs.duration_seconds }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/generate_first_short.py

      - name: Upload generated MP4
        if: success() && inputs.allow_credit_use
        uses: actions/upload-artifact@v4
        with:
          name: giggletoons-billi-doctor-short
          path: output/giggletoons_billi_doctor_hiccups_short.mp4
          if-no-files-found: error
          retention-days: 7
